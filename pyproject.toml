[project]
name = "ha-yasl"
version = "0.1.1"
description = "Yasl shopping lists as to-do lists in Home Assistant"
requires-python = ">=3.13"
license = "MIT"

[dependency-groups]
test = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"
